dataset: emowear
data_root: data/emowear/csv
modalities:
- ppg
- eda
ppg_sampling_rate: 64
eda_sampling_rate: 4
window_seconds: 30
window_policy: last30
num_folds: 5
val_fraction: 0.2
model: dual_conformer
hidden_dim: 40
depth: 2
heads: 4
dropout: 0.3
seed: 42
batch_size: 32
learning_rate: 0.0003
weight_decay: 0.001
epochs: 60
patience: 10
min_delta: 0.0
regression_loss: huber
device: auto
cpu_threads: 4
log_every: 5
ppg_normalization: window_zscore
eda_normalization: log_robust
exclude_neutral: false
preprocess:
  filter: true
  ppg_band:
  - 0.5
  - 4.0
  eda_lowpass: 0.8
  filter_order: 3
quality:
  max_missing_fraction: 0.05
  max_gap_seconds: 0.5
  flat_epsilon: 1.0e-08
  flat_fraction: 0.98
  jump_mad: 50
  saturation_value: null
  reject_flags:
  - negative_conductance
fold_ids: null
pilot: false
task: binary
output_dir: outputs/emowear/binary
