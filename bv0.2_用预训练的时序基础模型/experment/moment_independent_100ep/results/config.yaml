backbone_lr: 1.0e-05
batch_size: 16
cpu_bfloat16: false
cpu_threads: 8
data_root: ../../datasets/EmoWear/EmoWear_development
device: auto
eda_normalization: log_robust
exclude_neutral: false
fold: 0
full_epochs: 100
full_patience: null
gradient_clip: 1.0
head_epochs: 20
head_lr: 0.0001
head_patience: 5
num_folds: 5
ppg_normalization: standard
preprocess:
  eda_lowpass: 0.8
  filter: true
  filter_order: 3
  ppg_band:
  - 0.5
  - 4.0
quality:
  flat_epsilon: 1.0e-08
  flat_fraction: 0.98
  jump_mad: 50
  max_gap_seconds: 0.5
  max_missing_fraction: 0.05
  reject_flags:
  - negative_conductance
  saturation_value: null
ratios:
- 0.3
- 0.6
resolved_device: cuda
seed: 42
val_fraction: 0.2
weight_decay: 0.01
window_policy: last30
window_seconds: 30
